name: Build Ostree Container Image

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  push:
    branches: ["*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
      options: --privileged
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build
        env:
          QUAY_USER: ${{ vars.QUAY_USER }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          tag: ${{ github.ref_name }}
          composefile: container.yaml
        run: |
          dnf -y install rpm-ostree skopeo jq diffutils createrepo_c dnf5 selinux-policy-targeted --enablerepo=updates-testing
          printf '%s\n' "$QUAY_PASSWORD" | skopeo login --username "$QUAY_USER" --password-stdin quay.io
          tar czfv additional_files.tar.gz --owner=root --group=root etc
          bash scripts/publish-image.sh
